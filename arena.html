<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Календарь Арена</title>

    <style>
        :root { --border-color: #000; }
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body { 
            padding: 10px; 
            background: #3e4c60; 
            margin: 0;
            min-width: 320px;
        }

        .main-wrapper {
            width: 100%;
            max-width: 100%;
            margin: 0 auto;
            background: transparent;
            padding: 0;
        }

        /* ВЕРХНЯЯ ПАНЕЛЬ */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            padding: 10px 15px;
            background: #3e4c60;
            border-radius: 8px;
            margin-bottom: 20px;
            width: 100%;
            flex-wrap: wrap;
        }

        .top-bar-left {
            display: flex;
            align-items: center;
            gap: 15px;
            flex: 0 1 auto;
        }

        .top-bar-left img {
            width: 120px;
            height: 60px;
            border: none;
            flex-shrink: 0;
        }

        .legend {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 14px;
            border: 1px solid var(--border-color);
            padding: 4px 12px;
            background: transparent;
            white-space: nowrap;
            flex-shrink: 0;
            border-radius: 4px;
        }
        .legend-item:first-child {
            border: none;
            font-weight: bold;
            font-size: 20px;
            padding-left: 0;
            background: transparent;
        }
        .legend-item:last-child {
            border: none;
            font-weight: bold;
            color: #000000;
            font-size: 13px;
            background: transparent;
            padding: 0;
        }
        .color-box {
            width: 18px;
            height: 18px;
            border: 1px solid #000;
            flex-shrink: 0;
            border-radius: 3px;
        }

        .top-bar-right {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 0 1 auto;
        }

        .controls {
            display: flex;
            gap: 5px;
            align-items: center;
        }
        .btn-nav {
            padding: 6px 14px;
            font-size: 16px;
            background: transparent;
            border: 2px solid var(--border-color);
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s;
            min-width: 38px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        .btn-nav:hover { background: #000; color: #fff; }
        .btn-nav:disabled { opacity: 0.3; cursor: not-allowed; background: #eee; color: #000;}

        .view-controls {
            display: flex;
            gap: 4px;
            align-items: center;
        }
        .btn-view {
            width: 34px;
            height: 34px;
            border: 2px solid var(--border-color);
            background: transparent;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            transition: all 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }
        .btn-view:hover { background: #eee; }
        .btn-view.active {
            background: #000;
            color: #fff;
            border-color: #000;
        }

        .btn-link {
            padding: 0 16px;
            height: 34px;
            background: #ff6017;
            color: #ffffff;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 0 3px 0 #b84d12;
            transition: 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            text-decoration: none;
            flex-shrink: 0;
            white-space: nowrap;
        }
        .btn-link:hover {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #b84d12;
        }

        .save-wrapper {
            display: flex;
            justify-content: flex-end;
            margin-top: 15px;
            padding: 0 15px;
        }

        .btn-save {
            padding: 0 24px;
            height: 40px;
            border: 2px solid #007bff;
            background: #e6f2ff;
            cursor: pointer;
            font-size: 14px;
            border-radius: 6px;
            color: #0056b3;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
            white-space: nowrap;
            font-weight: 600;
        }
        .btn-save:hover {
            background: #007bff;
            color: #fff;
            border-color: #007bff;
        }

        /* 📌 СЕТКА КАЛЕНДАРЯ (ОСНОВНОЕ ПРИЛОЖЕНИЕ) */
        .calendar-grid {
            display: grid;
            gap: 10px 15px;
            width: 100%;
            max-width: 100%;
        }
        
        .grid-mode-1 { grid-template-columns: 1fr; }
        .grid-mode-2 { grid-template-columns: repeat(2, 1fr); }
        .grid-mode-4 { grid-template-columns: repeat(2, 1fr); }
        .grid-mode-6 { grid-template-columns: repeat(3, 1fr); }

        .month-container {
            background: transparent;
            display: none;
            min-width: 0;
            width: 100%;
            max-width: 100%;
        }
        
        .month-header {
            text-align: center;
            font-weight: bold;
            font-size: 20px;
            padding: 10px 0;
            margin-bottom: 0;
            background: transparent;
            border-bottom: 2px solid var(--border-color); 
            border-top: 2px solid var(--border-color);
            color: #000;
            width: 100%;
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            width: 100%;
            margin: 0;
            padding: 0;
        }

        .day-header {
            border-right: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            padding: 8px 0;
            text-align: center;
            font-size: 16px;
            background: transparent;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            width: 100%;
            margin: 0;
        }
        .day-header:last-child { border-right: none; }
        .day-header:nth-child(-n+7) { border-top: 1px solid var(--border-color); }
        .weekend-header { color: #ee5a5a; }

        .day-cell {
            border: 1px solid var(--border-color);
            position: relative;
            padding: 2px;
            background: transparent;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            aspect-ratio: 1 / 0.77;
            min-height: 70px;
            margin: 0;
        }
        .day-cell:hover {
            background: rgba(255,255,255,0.05);
        }
        .day-cell.today {
            border: 3px solid #ff0000 !important;
            z-index: 1;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.2);
        }

        .day-number {
            position: absolute;
            top: 2px;
            right: 4px;
            font-size: 12px;
            font-weight: bold;
            z-index: 10;
            background: transparent;
            padding: 0 2px;
            pointer-events: none;
            color: #333;
            line-height: 1;
        }

        .event {
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            width: 100%;
            height: 100%;
            padding: 2px 3px;
            margin: 0;
            border: 0;
            border-radius: 0;
            box-shadow: none;
            font-size: 14px; 
            line-height: 1.2;
            word-break: break-word;
            white-space: normal;
            font-weight: 500;
            flex: 1;
            min-height: 0;
        }
        .event b { font-weight: 900; }
        
        .empty-cell { 
            background: transparent; 
            width: 100%;
            aspect-ratio: 1 / 0.77;
            min-height: 70px;
            border: none !important; 
            margin: 0;
        }

        .bg-FACDE5 { background-color: #FACDE5; color: #000; }
        .bg-92D050 { background-color: #92D050; color: #000; }
        .bg-F39C4b { background-color: #F39C4b; color: #fff; }
        .bg-891115 { background-color: #fffff1; color: #000; }
        .bg-FFFFFF { background-color: #ffffff; color: #fa1313; border: 3px solid #e94343; }

        /* 🔥 КОНТЕЙНЕР ДЛЯ СКРИНШОТА */
        #screenshot-container {
            position: fixed;
            top: -9999px;
            left: -9999px;
            background: #f9f9f9;
            padding: 30px;
            z-index: -1;
            width: 1200px; 
        }
        #screenshot-container .top-bar {
            background: #f9f9f9;
            margin-bottom: 25px;
            padding: 0;
        }
        #screenshot-container .top-bar-right {
            display: none !important;
        }
        #screenshot-container .save-wrapper {
            display: none !important;
        }
        
        /* 🔥 СЕТКА ДЛЯ СКРИНШОТА */
        #screenshot-grid {
            display: grid;
            gap: 20px;
            width: 100%;
        }
        #screenshot-grid.grid-mode-1 { grid-template-columns: 1fr; }
        #screenshot-grid.grid-mode-2 { grid-template-columns: repeat(2, 1fr); }
        #screenshot-grid.grid-mode-4 { grid-template-columns: repeat(2, 1fr); }
        #screenshot-grid.grid-mode-6 { grid-template-columns: repeat(3, 1fr); }

        .screenshot-month-box {
            background: #ffffff;
            border: 2px solid #ccc;
            border-radius: 8px;
            padding: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
            overflow: hidden;
        }
        .screenshot-month-box .month-header {
            background: #f5f5f5;
        }

        /* 📱 АДАПТИВ */
        @media (max-width: 1200px) {
            .event { font-size: 12px; } 
        }

        @media (max-width: 900px) {
            .top-bar {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
            }
            .top-bar-left {
                justify-content: center;
                flex-wrap: wrap;
            }
            .top-bar-right {
                justify-content: center;
                flex-wrap: wrap;
            }
            .calendar-grid.grid-mode-6 { grid-template-columns: repeat(2, 1fr); }
            .calendar-grid.grid-mode-4 { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 600px) {
            .calendar-grid.grid-mode-2, 
            .calendar-grid.grid-mode-4, 
            .calendar-grid.grid-mode-6 { grid-template-columns: 1fr; }
        }
    </style>
</head>

<body>

<div class="main-wrapper">
    <!-- ВЕРХНЯЯ ПАНЕЛЬ -->
    <div class="top-bar">
        <div class="top-bar-left">
            <img src="./img/avangard.png" alt="Мероприятие"/>
            <div class="legend">
                <div class="legend-item">АРЕНА</div>
                <div class="legend-item"><div class="color-box bg-FACDE5"></div> Мероприятия</div>
                <div class="legend-item"><div class="color-box bg-92D050"></div> Домашний матч</div>
                <div class="legend-item"><div class="color-box bg-FFFFFF"></div> не согласовано</div>
                <div class="legend-item">подготовлен <span id="date-display"></span></div>
            </div>
        </div>

        <div class="top-bar-right">
            <div class="controls">
                <button class="btn-nav" id="prevBtn">◀</button>
                <button class="btn-nav" id="nextBtn">▶</button>
            </div>

            <div class="view-controls">
                <button class="btn-view" data-view="1">1</button>
                <button class="btn-view active" data-view="2">2</button>
                <button class="btn-view" data-view="4">4</button>
                <button class="btn-view" data-view="6">6</button>
            </div>

            <a href="./index.html" class="btn-link">📌Timeline</a>
            <a href="./skk.html" class="btn-link">🏟️СКК</a>
        </div>
    </div>

    <!-- КАЛЕНДАРЬ -->
    <div id="app" class="calendar-grid grid-mode-2"></div>

    <!-- КНОПКА СОХРАНЕНИЯ -->
    <div class="save-wrapper">
        <button class="btn-save" id="saveBtn">💾 Сохранить календарь.png</button>
    </div>
</div>

<!-- 🔥 КОНТЕЙНЕР ДЛЯ СКРИНШОТА -->
<div id="screenshot-container">
    <div class="top-bar">
        <div class="top-bar-left">
            <img src="./img/avangard.png" alt="Мероприятие"/>
            <div class="legend">
                <div class="legend-item">АРЕНА</div>
                <div class="legend-item"><div class="color-box bg-FACDE5"></div> Мероприятия</div>
                <div class="legend-item"><div class="color-box bg-92D050"></div> Домашний матч</div>
                <div class="legend-item"><div class="color-box bg-FFFFFF"></div> Отменено</div>
                <div class="legend-item">подготовлен <span class="date-display-screenshot"></span></div>
            </div>
        </div>
    </div>
    <div id="screenshot-grid" class="grid-mode-2"></div>
</div>

<script src="./js/jquery-3.3.1.min.js"></script>
<script src="./js/html2canvas.min.js"></script>
<script src="./js/dateadd.js"></script>

<script>
    let fullData = [];
    let currentStartIndex = 0; 
    let viewMode = 2;

    const daysOfWeek = ['пн', 'вт', 'ср', 'чт', 'пт', 'сб', 'вс'];

    // 📌 Функция получения даты изменения events.json
    function getFileModifiedDate(callback) {
        $.ajax({
            url: './events.json',
            type: 'HEAD',
            success: function(data, textStatus, xhr) {
                const lastModified = xhr.getResponseHeader('Last-Modified');
                if (lastModified) {
                    callback(new Date(lastModified));
                } else {
                    callback(null);
                }
            },
            error: function() {
                callback(null);
            }
        });
    }

    // 📌 Функция форматирования даты (дд.мм.гггг чч:мм)
    function formatDateTime(date) {
        if (!date || isNaN(date.getTime())) return null;
        const day = String(date.getDate()).padStart(2, '0');
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const year = date.getFullYear();
        const hours = String(date.getHours()).padStart(2, '0');
        const minutes = String(date.getMinutes()).padStart(2, '0');
        return `${day}.${month}.${year} ${hours}:${minutes}`;
    }

    // 📌 Функция применения размера шрифта в зависимости от количества месяцев
    function applyFontSize(mode) {
        let size = '14px'; 
        if (mode === 1) size = '20px';
        else if (mode === 2) size = '14px';
        else if (mode === 4) size = '14px';
        else if (mode === 6) size = '12px';

        $('#app .event').css('font-size', size);
        $('#screenshot-container .event').css('font-size', size);
    }

    // 📌 Функция изменения ширины контейнера для скриншота под количество колонок
    function applyScreenshotWidth(mode) {
        const $container = $('#screenshot-container');
        if (mode === 6) {
            $container.css('width', '2000px');
        } else if (mode === 4) {
            $container.css('width', '1600px');
        } else {
            $container.css('width', '1200px');
        }
    }

    $(document).ready(function() {
        // 🔥 Получаем дату изменения events.json
        getFileModifiedDate(function(modifiedDate) {
            const dateStr = formatDateTime(modifiedDate);
            
            if (dateStr) {
                $('#date-display').text(dateStr);
                $('.date-display-screenshot').text(dateStr);
            } else {
                const now = new Date();
                const fallbackDate = now.toLocaleDateString('ru-RU', {
                    day: '2-digit',
                    month: '2-digit',
                    year: 'numeric'
                });
                $('#date-display').text(fallbackDate);
                $('.date-display-screenshot').text(fallbackDate);
            }
        });

        loadAndRender(0, 2);

        $('#prevBtn').on('click', function() {
            if (currentStartIndex >= viewMode) {
                loadAndRender(currentStartIndex - viewMode, viewMode);
            }
        });
        
        $('#nextBtn').on('click', function() {
            if (currentStartIndex + viewMode < fullData.length) {
                loadAndRender(currentStartIndex + viewMode, viewMode);
            }
        });

        $('.btn-view').on('click', function() {
            $('.btn-view').removeClass('active');
            $(this).addClass('active');
            viewMode = parseInt($(this).data('view'));
            
            const $grid = $('#app');
            $grid.removeClass('grid-mode-1 grid-mode-2 grid-mode-4 grid-mode-6').addClass(`grid-mode-${viewMode}`);
            
            const $screenshotGrid = $('#screenshot-grid');
            $screenshotGrid.removeClass('grid-mode-1 grid-mode-2 grid-mode-4 grid-mode-6').addClass(`grid-mode-${viewMode}`);

            applyFontSize(viewMode);
            applyScreenshotWidth(viewMode);

            currentStartIndex = 0;
            loadAndRender(0, viewMode);
        });

        // 🔥 СОХРАНЕНИЕ СКРИНШОТА
        $('#saveBtn').on('click', function() {
            renderScreenshotContainer(currentStartIndex, viewMode);

            const $container = $('#screenshot-container');
            const originalText = $(this).text();
            $(this).text('⏳ Генерация...').prop('disabled', true);

            applyScreenshotWidth(viewMode);

            html2canvas($container[0], {
                scale: 3,
                useCORS: true,
                backgroundColor: '#f9f9f9',
                windowWidth: $container.width(),
                windowHeight: $container.height(),
                logging: false
            }).then(canvas => {
                $(this).text(originalText).prop('disabled', false);
                const link = document.createElement('a');
                link.download = `календарь_авангард_${new Date().toISOString().slice(0,10)}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            }).catch(err => {
                console.error("Ошибка скриншота:", err);
                $(this).text(originalText).prop('disabled', false);
                alert("Ошибка при создании скриншота!");
            });
        });
    });

    // 🔥 ФУНКЦИЯ ДЛЯ ЗАПОЛНЕНИЯ СКРЫТОГО КОНТЕЙНЕРА
    function renderScreenshotContainer(startIndex, count) {
        const $screenshotGrid = $('#screenshot-grid');
        $screenshotGrid.empty();

        const monthsToRender = fullData.slice(startIndex, startIndex + count);
        monthsToRender.forEach((monthObj) => {
            const monthHtml = `<div class="screenshot-month-box">${buildMonthHTML(monthObj)}</div>`;
            $screenshotGrid.append(monthHtml);
        });

        applyFontSize(viewMode);
    }

    function loadAndRender(startIndex, count) {
        const app = $('#app');
        app.empty(); 

        if (fullData.length === 0) {
            $.ajax({
                url: './events.json',
                dataType: 'json',
                success: function(data) {
                    fullData = data.months;
                    renderPage(startIndex, count);
                    renderScreenshotContainer(startIndex, count);
                    applyFontSize(viewMode);
                    applyScreenshotWidth(viewMode);
                },
                error: function(xhr, status, error) {
                    app.html(`<div style="color: red; grid-column: 1/-1; text-align: center; padding: 50px;">
                        ❌ Ошибка загрузки JSON.
                    </div>`);
                    console.error(error);
                }
            });
        } else {
            renderPage(startIndex, count);
            renderScreenshotContainer(startIndex, count);
            applyFontSize(viewMode);
            applyScreenshotWidth(viewMode);
        }
    }

    function renderPage(startIndex, count) {
        currentStartIndex = startIndex;
        const monthsToRender = fullData.slice(startIndex, startIndex + count);
        
        $('#prevBtn').prop('disabled', startIndex === 0);
        $('#nextBtn').prop('disabled', startIndex + count >= fullData.length);

        const app = $('#app');

        monthsToRender.forEach((monthObj, index) => {
            const monthHtml = buildMonthHTML(monthObj);
            const $month = $(monthHtml);
            app.append($month);
            $month.delay(index * 100).fadeIn(400);
        });
        
        setTimeout(() => applyFontSize(viewMode), 50);
    }

    function buildMonthHTML(monthObj) {
        const allowedEvents = monthObj.events.filter(item => {
            const row = item.node.row;
            const bg = item.node.bgColor;
            if (row === 1) return true;
            if (row === 2 && bg === "#92D050") return true;
            return false;
        });

        const startParts = monthObj.start.split('-');
        const year = parseInt(startParts[0]);
        const monthIndex = parseInt(startParts[1]) - 1;
        
        const startDate = new Date(year, monthIndex, 1);
        const daysInMonth = new Date(year, monthIndex + 1, 0).getDate();

        let firstDayOffset = startDate.getDay();
        if (firstDayOffset === 0) firstDayOffset = 7; 
        firstDayOffset -= 1; 

        let totalSlots = firstDayOffset + daysInMonth;
        let rows = Math.ceil(totalSlots / 7);
        let totalCells = rows * 7;

        let html = `<div class="month-container" style="display: block;">
            <div class="month-header">${monthObj.month}</div>
            <div class="days-grid">`;

        for (let d = 0; d < 7; d++) {
            const weekendClass = d >= 5 ? 'weekend-header' : '';
            html += `<div class="day-header ${weekendClass}">${daysOfWeek[d]}</div>`;
        }

        const parsedEvents = allowedEvents.map(item => {
            const startPartsEv = item.node.start.split(/[\s-:]/);
            const endPartsEv = item.node.end.split(/[\s-:]/);
            const start = new Date(parseInt(startPartsEv[0]), parseInt(startPartsEv[1])-1, parseInt(startPartsEv[2]));
            const end = new Date(parseInt(endPartsEv[0]), parseInt(endPartsEv[1])-1, parseInt(endPartsEv[2]));
            return { ...item, startDate: start, endDate: end };
        });

        const today = new Date();
        const todayDay = today.getDate();
        const todayMonth = today.getMonth();
        const todayYear = today.getFullYear();

        for (let i = 0; i < totalCells; i++) {
            const dayNum = i - firstDayOffset + 1;

            if (dayNum >= 1 && dayNum <= daysInMonth) {
                const isToday = (dayNum === todayDay && monthIndex === todayMonth && year === todayYear);
                const todayClass = isToday ? ' today' : '';
                
                html += `<div class="day-cell${todayClass}" data-day="${dayNum}">
                    <div class="day-number">${dayNum}</div>`;

                const checkDate = new Date(year, monthIndex, dayNum);
                const eventsForDay = parsedEvents.filter(ev => checkDate >= ev.startDate && checkDate <= ev.endDate);

                eventsForDay.forEach(ev => {
                    const colorClass = `bg-${ev.node.bgColor.replace('#', '')}`;
                    
                    let eventText = ev.html;
                    if (viewMode === 6) {
                        eventText = eventText
                            .replace('Тренировка АКАДЕМИЯ', 'Академия')
                            .replace('Турнир им. В. Блинова', 'Турнир Блинова')
                            .replace('Динамо М', 'Динамо')
                            .replace('Локомотив', 'Локо')
                            .replace('Автомобилист', 'Авто')
                            .replace('Сибирь', 'Сиб')
                            .replace('Ак Барс', 'АКБ');
                    }

                    html += `<div class="event ${colorClass}">${eventText}</div>`;
                });

                html += `</div>`;
            } else {
                html += `<div class="empty-cell"></div>`;
            }
        }

        html += `</div></div>`;
        return html;
    }
</script>
</body>
</html>
