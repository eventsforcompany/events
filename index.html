  #custom-tooltip::after {
    content: '';

    bottom: -8px;
    left: 50%;
    transform: translateX(-50%);

<script>
document.addEventListener('DOMContentLoaded', function() {
    // ========== ОБЩИЕ ФУНКЦИИ ==========
    function pad(n) { return n.toString().padStart(2, '0'); }

    // Парсим дату и вычитаем 6 часов (компенсация часового пояса)
    function parseDateWithOffset(dateStr, offsetHours = -6) {
        if (!dateStr) return null;
        
        const parts = dateStr.split(' ');
        const dateParts = parts[0].split('-');
        const year = parseInt(dateParts[0]);
        const month = parseInt(dateParts[1]) - 1;
        const day = parseInt(dateParts[2]);
        
        let hour = 0, minute = 0, second = 0;
        if (parts.length > 1) {
            const timeParts = parts[1].split(':');
            hour = parseInt(timeParts[0]);
            minute = parseInt(timeParts[1]);
            second = parseInt(timeParts[2] || 0);
        }
        
        // Создаем дату
        const dt = new Date(year, month, day, hour, minute, second);
        
        // Вычитаем offsetHours (по умолчанию -6 часов)
        dt.setHours(dt.getHours() + offsetHours);
        
        return dt;
    }

    function toICalDate(dateStr, offsetHours = -6) {
        if (!dateStr) return '19700101T000000';
        
        const dt = parseDateWithOffset(dateStr, offsetHours);
        if (!dt || isNaN(dt.getTime())) return '19700101T000000';
        
        const y = dt.getFullYear();
        const m = pad(dt.getMonth() + 1);
        const d = pad(dt.getDate());
        const h = pad(dt.getHours());
        const min = pad(dt.getMinutes());
        const s = pad(dt.getSeconds());
        
        return `${y}${m}${d}T${h}${min}${s}`;
    }

    function buildIcs(events, fileName) {
        if (!events || events.length === 0) return null;
        
        let ics = [
            'BEGIN:VCALENDAR',
            'VERSION:2.0',
            `PRODID:-//${fileName}//RU`,
            'CALSCALE:GREGORIAN',
            'METHOD:PUBLISH',
            'X-WR-TIMEZONE:Europe/Moscow'
        ];
        
        events.forEach(ev => {
            const node = ev.node || {};
            const startRaw = node.start || '';
            const endRaw = node.end || startRaw;
            
            // Для окончания используем ту же дату, но с вычетом 6 часов
            let endDate = endRaw || startRaw;
            
            // Если время окончания не указано или равно start, добавляем 2 часа
            if (endDate === startRaw && startRaw) {
                const dt = parseDateWithOffset(startRaw, -6);
                if (dt) {
                    dt.setHours(dt.getHours() + 2);
                    endDate = `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())} ${pad(dt.getHours())}:${pad(dt.getMinutes())}:${pad(dt.getSeconds())}`;
                }
            }
            
            const dtstart = toICalDate(startRaw, -6);
            const dtend = toICalDate(endDate, -6);
            
            let summary = ev.html || 'Event';
            summary = summary.replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();
            if (summary.length > 80) summary = summary.slice(0, 80) + '…';
            
            ics.push(
                'BEGIN:VEVENT',
                `UID:${Date.now()}-${Math.random().toString(36).slice(2,8)}@${fileName}`,
                `DTSTAMP:${toICalDate(new Date().toISOString().slice(0,19).replace('T', ' '), 0)}`,
                `DTSTART:${dtstart}`,
                `DTEND:${dtend}`,
                `SUMMARY:${summary}`,
                'END:VEVENT'
            );
        });
        
        ics.push('END:VCALENDAR');
        return ics.join('\r\n');
    }

    function filterEventsByRow(data, row) {
        const events = [];
        if (data.months && Array.isArray(data.months)) {
            data.months.forEach(month => {
                if (month.events && Array.isArray(month.events)) {
                    month.events.forEach(ev => {
                        const evRow = ev.node?.row;
                        if (evRow !== undefined && Number(evRow) === row) {
                            events.push(ev);
                        }
                    });
                }
            });
        }
        return events;
    }

    async function downloadIcs(row, fileName, button) {
        const originalText = button.innerHTML;
        button.innerHTML = '⏳...';
        button.disabled = true;

        try {
            const response = await fetch('./events.json');
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const data = await response.json();

            const events = filterEventsByRow(data, row);

            if (events.length === 0) {
                alert(`Нет событий с row = ${row} в events.json`);
                button.innerHTML = originalText;
                button.disabled = false;
                return;
            }

            const icsContent = buildIcs(events, fileName);
            if (!icsContent) {
                alert('Ошибка генерации ICS');
                button.innerHTML = originalText;
                button.disabled = false;
                return;
            }

            const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `${fileName}.ics`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);

            button.innerHTML = '✅';
            setTimeout(() => { button.innerHTML = originalText; }, 2000);
        } catch (err) {
            console.error(err);
            alert('Ошибка: ' + err.message);
            button.innerHTML = originalText;
        }
        button.disabled = false;
    }

    // ========== НАСТРОЙКА КНОПОК ==========
    
    // 1. АРЕНА -> row 1
    const arenaBtn = document.getElementById('exportArenaBtn');
    if (arenaBtn) {
        arenaBtn.addEventListener('click', function() {
            downloadIcs(1, 'ARENA', this);
        });
    }

    // 2. КХЛ -> row 2
    const khlBtn = document.getElementById('exportKHLBtn');
    if (khlBtn) {
        khlBtn.addEventListener('click', function() {
            downloadIcs(2, 'KHL', this);
        });
    }

    // 3. МХЛ -> row 3
    const mhlBtn = document.getElementById('exportMHLBtn');
    if (mhlBtn) {
        mhlBtn.addEventListener('click', function() {
            downloadIcs(3, 'MHL', this);
        });
    }

    // 4. ВХЛ -> row 4
    const vhlBtn = document.getElementById('exportVHLBtn');
    if (vhlBtn) {
        vhlBtn.addEventListener('click', function() {
            downloadIcs(4, 'VHL', this);
        });
    }

    // 5. СКК -> row 5
    const skkBtn = document.getElementById('exportSKKBtn');
    if (skkBtn) {
        skkBtn.addEventListener('click', function() {
            downloadIcs(5, 'SKK', this);
        });
    }

    // 6. Печать (5 мес) -> без preview
    const pdfBtn = document.getElementById('exportPdfBtn');
    if (pdfBtn) {
        pdfBtn.addEventListener('click', function() {
            window.print();
        });
    }
});
</script>

<script>
document.getElementById('exportPdfBtn').addEventListener('click', function() {
    console.log('📄 Экспорт начат (JPEG)...');
    
    // ============================================================
    // 🔧 НАСТРОЙКИ ДЛЯ JPEG (играйте с этими параметрами)
    // ============================================================
    var CONFIG = {
        // Ширина контейнера для скриншота
        containerWidth: 3000,        // Попробуйте: 3000, 4000, 4500, 5000
        
        // Отступы внутри контейнера
        containerPadding: '5px 5px 5px 5px',
        
        // Масштаб скриншота (1-3)
        screenshotScale: 3,        // 2 = хорошо, 2.5 = отлично, 3 = превосходно
        
        // Качество JPEG (0.7-1.0)
        jpegQuality: 0.95,           // 0.95 = отличное качество
        
        // Задержка перед скриншотом (мс)
        renderDelay: 1500,
        
        // Имя файла
        fileName: 'calendar_' + new Date().toISOString().slice(0,10) + '.jpg',
    };
    // ============================================================
    
    var containers = document.querySelectorAll('.timeline-container');
    if (containers.length === 0) {
        alert('❌ Нет данных для экспорта');
        return;
    }
    
    var exportContainers = Array.from(containers).slice(0, 5);
    
    // Создаем контейнер
    var wrapper = document.createElement('div');
    wrapper.style.cssText = `
        position: relative;
        left: 0;
        top: 0;
        width: ${CONFIG.containerWidth}px;
        background: #ffffff;
        z-index: 999999;
        padding: ${CONFIG.containerPadding};
        font-family: Arial, sans-serif;
    `;
    
    // ---- Заголовок ----
    var header = document.createElement('div');
    header.style.cssText = 'display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;padding:0 2px;';
    

    
    var date = document.createElement('span');
    var now = new Date();
    date.textContent = now.toLocaleDateString('ru-RU', { day:'numeric', month:'long', year:'numeric' });
    date.style.cssText = 'color:#555;font-size:10px;';
    header.appendChild(date);
    wrapper.appendChild(header);
    
    // ---- Копируем контейнеры ----
    exportContainers.forEach(function(c, index) {
        var clone = c.cloneNode(true);
        clone.style.cssText = `
            margin-bottom: 1px;
            border: 1px solid #ccc;
            padding: 5px 5px 5px 5px;
            border-radius: 1px;
            background: #fff;
            width: 100%;
            overflow: visible;
        `;
        
        var monthTitle = clone.querySelector('.month-title');
        if (monthTitle) {
            monthTitle.style.cssText = 'font-size:16px;color:#555;font-weight:bold;margin:0 0 8px 0;padding:0;';
        }
        
        var innerContainer = clone.querySelector('.jqtl-container');
        if (innerContainer) {
            innerContainer.style.cssText = `
                width: 100% !important;
                height: auto !important;
                overflow: visible !important;
                max-width: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
                background: #fff !important;
            `;
        }
        
        var canvases = clone.querySelectorAll('canvas');
        canvases.forEach(function(canvas) {
            canvas.style.width = '100%';
            canvas.style.height = 'auto';
            canvas.style.background = '#fff'; // фон календаря
        });
        
        var eventNodes = clone.querySelectorAll('.jqtl-event-node');
        eventNodes.forEach(function(node) {
            node.style.margin = '0';
            node.style.padding = '2px 0';
            var labels = node.querySelectorAll('.jqtl-event-label, .event-label');
            labels.forEach(function(label) {
                label.style.fontSize = '9px';
                label.style.fontWeight = 'bold';
            });
            var contents = node.querySelectorAll('.jqtl-event-content, .event-content');
            contents.forEach(function(content) {
                content.style.fontSize = '10px';
            });
        });
        
        var sidebar = clone.querySelector('.jqtl-side-index');
        if (sidebar) {
            sidebar.style.margin = '0';
            sidebar.style.padding = '0 2px 0 0';
            sidebar.style.background = '#000'; // фон бар
            var items = sidebar.querySelectorAll('.jqtl-side-index-item');
            items.forEach(function(item) {
                item.style.fontSize = '10px';
                item.style.padding = '1px 0';
                item.style.margin = '0';
                item.style.background = '#fff'; // фон бар
            });
        }
        
        wrapper.appendChild(clone);
        console.log('  ✅ Контейнер ' + (index + 1) + ' скопирован');
    });
    
    document.body.appendChild(wrapper);
    console.log('✅ Контейнер создан, размер:', CONFIG.containerWidth + 'px');
    
    var btn = this;
    var origText = btn.textContent;
    btn.textContent = '⏳ Создание JPEG...';
    btn.disabled = true;
    btn.style.opacity = '0.6';
    
    setTimeout(function() {
        var wrapperHeight = wrapper.scrollHeight;
        var wrapperWidth = wrapper.scrollWidth;
        console.log('📐 Размеры:', wrapperWidth + 'x' + wrapperHeight);
        
        html2canvas(wrapper, {
            scale: CONFIG.screenshotScale,
            useCORS: true,
            logging: false,
            width: wrapperWidth,
            height: wrapperHeight,
            windowWidth: wrapperWidth,
            windowHeight: wrapperHeight,
            onclone: function(doc) {
                doc.querySelectorAll('canvas').forEach(function(c) {
                    c.style.width = '100%';
                    c.style.height = 'auto';
                });
            }
        }).then(function(canvas) {
            console.log('✅ Скриншот создан');
            
            // Создаем ссылку для скачивания JPEG
            var link = document.createElement('a');
            link.download = CONFIG.fileName;
            link.href = canvas.toDataURL('image/jpeg', CONFIG.jpegQuality);
            link.click();
            
            document.body.removeChild(wrapper);
            btn.textContent = origText;
            btn.disabled = false;
            btn.style.opacity = '1';
            console.log('✅ JPEG сохранен!');
            
        }).catch(function(err) {
            console.error('❌ Ошибка:', err);
            alert('❌ Ошибка: ' + err.message);
            if (document.body.contains(wrapper)) {
                document.body.removeChild(wrapper);
            }
            btn.textContent = origText;
            btn.disabled = false;
            btn.style.opacity = '1';
        });
    }, CONFIG.renderDelay);
});
</script>

<script>
(function() {
    'use strict';

    // Создаем тултип
    const tip = document.createElement('div');
    tip.id = 'event-tooltip';
    tip.style.cssText = `
        position: fixed;
        background: #222;
        color: #fff;
        padding: 12px 18px;
        border-radius: 10px;
        font-size: 14px;
        max-width: 350px;
        z-index: 999999;
        pointer-events: none;
        box-shadow: 0 8px 30px rgba(0,0,0,0.5);
        border: 1px solid #444;
        display: none;
        font-family: Arial, sans-serif;
        line-height: 1.6;
        word-wrap: break-word;
        opacity: 0;
        transition: opacity 0.2s ease;
    `;
    document.body.appendChild(tip);

    // Стили
    const style = document.createElement('style');
    style.textContent = `
        #event-tooltip.visible {
            display: block !important;
            opacity: 1 !important;
        }
        #event-tooltip::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            border: 7px solid transparent;
            border-top-color: #222;
        }
        @keyframes tooltipFadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        #event-tooltip.visible {
            animation: tooltipFadeIn 0.15s ease;
        }
        /* Стили для HTML внутри тултипа */
        #event-tooltip br {
            display: block;
            content: '';
            margin: 4px 0;
        }
        #event-tooltip strong,
        #event-tooltip b {
            color: #ffd700;
        }
        #event-tooltip .event-label {
            color: #ffd700;
            font-weight: bold;
        }
        #event-tooltip .event-content {
            color: #fff;
        }
        /* Подсветка кликнутого события */
        .jqtl-event-node.clicked-for-tooltip {
            outline: 2px solid #ff6b6b !important;
            outline-offset: 2px !important;
            z-index: 100 !important;
        }
    `;
    document.head.appendChild(style);

    let currentTarget = null;
    let isTooltipVisible = false;

    function updatePosition(e) {
        let left = e.clientX + 15;
        let top = e.clientY + 15;

        const tw = tip.offsetWidth || 300;
        const th = tip.offsetHeight || 50;

        if (left + tw > window.innerWidth - 10) {
            left = e.clientX - tw - 15;
        }
        if (top + th > window.innerHeight - 10) {
            top = window.innerHeight - th - 10;
        }
        if (top < 10) top = 10;

        tip.style.left = left + 'px';
        tip.style.top = top + 'px';
    }

    function getEventHTML(eventNode) {
        let html = '';
        
        // Пытаемся получить HTML из .event-content
        const contentEl = eventNode.querySelector('.event-content');
        if (contentEl) {
            html += contentEl.innerHTML;
        }
        
        // Также пробуем взять HTML из .jqtl-event-label
        const labelEl = eventNode.querySelector('.jqtl-event-label, .event-label');
        if (labelEl && labelEl.innerHTML.trim()) {
            const labelHTML = labelEl.innerHTML.trim();
            // Если есть и label, и content, разделяем их
            if (html && labelHTML) {
                html = '<span class="event-label">' + labelHTML + '</span><br><span class="event-content">' + html + '</span>';
            } else if (labelHTML) {
                html = '<span class="event-label">' + labelHTML + '</span>';
            }
        }
        
        // Если ничего не нашли, берем textContent
        if (!html) {
            html = eventNode.textContent.trim();
        }
        
        return html;
    }

    function showTooltip(htmlContent, e, eventNode) {
        // Убираем старую подсветку
        document.querySelectorAll('.jqtl-event-node.clicked-for-tooltip').forEach(el => {
            el.classList.remove('clicked-for-tooltip');
        });
        
        // Подсвечиваем текущий элемент
        if (eventNode) {
            eventNode.classList.add('clicked-for-tooltip');
        }
        
        // Вставляем HTML
        tip.innerHTML = htmlContent;
        tip.classList.add('visible');
        updatePosition(e);
        isTooltipVisible = true;
        console.log('🔍 Тултип показан (HTML):', htmlContent.substring(0, 40) + '...');
    }

    function hideTooltip() {
        tip.classList.remove('visible');
        isTooltipVisible = false;
        currentTarget = null;
        // Убираем подсветку
        document.querySelectorAll('.jqtl-event-node.clicked-for-tooltip').forEach(el => {
            el.classList.remove('clicked-for-tooltip');
        });
    }

    // ----- ОСНОВНОЙ ОБРАБОТЧИК -----
    document.addEventListener('click', function(e) {
        // Ищем контейнер события
        const eventNode = e.target.closest('.jqtl-event-node, .jqtl-event');
        
        if (eventNode) {
            // Получаем HTML-содержимое события
            const htmlContent = getEventHTML(eventNode);
            
            if (htmlContent && htmlContent.trim().length > 0) {
                // Останавливаем всплытие
                e.stopPropagation();
                e.preventDefault();
                
                currentTarget = eventNode;
                showTooltip(htmlContent, e, eventNode);
            }
        } else {
            // Кликнули не по событию — скрываем
            if (isTooltipVisible) {
                hideTooltip();
            }
        }
    }, true);

    // Обновляем позицию при движении мыши
    document.addEventListener('mousemove', function(e) {
        if (isTooltipVisible) {
            updatePosition(e);
        }
    });

    // Скрываем при Escape
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && isTooltipVisible) {
            hideTooltip();
        }
    });

    // Закрываем при скролле
    document.addEventListener('scroll', function() {
        if (isTooltipVisible) {
            hideTooltip();
        }
    });

    console.log('✅ Тултип с поддержкой HTML готов! Кликайте на события.');
})();
</script>

<!-- ===== СКРИПТ ИНИЦИАЛИЗАЦИИ КАЛЕНДАРЯ ===== 
<script>
// Отключаем встроенный обработчик кликов плагина
$(document).off('click.open.jqtl');
</script> 
-->
<script>
$(function() {

  const baseOptions = {
    type: 'bar',
    scale: 'day',
    range: 6,
    shift: true,
    rows: 5,
    minGridSize: 90,
    headline: {
      display: true,
      range: true,
      locale: 'ru-RU',
      format: { timeZone: 'Asia/Omsk', hour12: false, year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' }
    },
    sidebar: {
      sticky: true,
      list: [
        '<img src="./img/arena.png" alt="Мероприятие" class="sidebar-icon" style="width:24px;height:24px;" />',
        '<img src="./img/khl.png" alt="КХЛ" class="sidebar-icon" style="width:24px;height:24px;" />',
        '<img src="./img/mhl.png" alt="МХЛ" class="sidebar-icon" style="width:24px;height:24px;" />',
        '<img src="./img/vhl.png" alt="МХЛ" class="sidebar-icon" style="width:24px;height:24px;" />',
        '<img src="./img/skk.png" alt="Мероприятие" class="sidebar-icon" style="width:24px;height:24px;" />'
      ]
    },
    ruler: {
      top: {
        lines: ['day', 'weekday'],
        height: 25,
        fontSize: 14,
        color: '#FFF',
        background: '#333',
        locale: 'ru-RU',
        format: { timeZone: 'Asia/Omsk', hour12: false, year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' }
      }
    },
    rangeAlign: 'day',
    hideScrollbar: true,
    zoom: true
  };

  function renderTimeline(data) {
    const $container = $('#timelineContainer');
    $container.empty();

    if (!data || !data.months || data.months.length === 0) {
      $container.html('<div class="error-msg">⚠️ Нет данных</div>');
      return;
    }

    const today = new Date();
    today.setHours(0, 0, 0, 0);

    const filteredMonths = data.months.filter(monthData => {
      const lastDay = new Date(monthData.end + 'T23:59:59');
      return lastDay >= today;
    });

    if (filteredMonths.length === 0) {
      $container.html('<div class="error-msg">⚠️ Нет предстоящих событий</div>');
      return;
    }

    if (filteredMonths.length < data.months.length) {
      $container.append('<div class="filter-info">📌 Показаны только актуальные месяцы (' + filteredMonths.length + ' из ' + data.months.length + ')</div>');
    }

    console.log('✅ Показано месяцев:', filteredMonths.length, '(всего:', data.months.length, ')');

    let html = '';
    filteredMonths.forEach(function(monthData, index) {
      html += '<div class="timeline-container">';
      html += '<div class="month-title">' + monthData.month + '</div>';
      html += '<div id="' + monthData.id + '">';
      html += '<ul class="timeline-events">';

      if (monthData.events && monthData.events.length > 0) {
        monthData.events.forEach(function(event) {
          const node = event.node;
          let nodeObj = {};
          for (let key in node) {
            nodeObj[key] = node[key];
          }
          const nodeJson = JSON.stringify(nodeObj);
          html += '<li data-timeline-node=\'' + nodeJson + '\'>';
          html += event.html;
          html += '</li>';
        });
      } else {
        html += '<li style="padding:20px;text-align:center;color:#999;">Нет событий</li>';
      }

      html += '</ul>';
      html += '</div>';
      html += '</div>';
    });

    $container.append(html);

    filteredMonths.forEach(function(monthData, index) {
      setTimeout(function() {
        const options = $.extend({}, baseOptions, {
          startDatetime: monthData.start,
          endDatetime: monthData.end,
        });

        try {
          const $tl = $('#' + monthData.id);
          if ($tl.length > 0) {
            $tl.Timeline(options);
            console.log('  ✅ Инициализирован:', monthData.id);
          }
        } catch(e) {
          console.error('  ❌ Ошибка инициализации', monthData.id, e);
        }
      }, index * 300);
    });

    const totalEvents = filteredMonths.reduce((sum, m) => sum + (m.events ? m.events.length : 0), 0);
    console.log('📊 Всего событий:', totalEvents);
  }

  function loadData() {
    const $container = $('#timelineContainer');
    $container.html('<div class="loading"><span class="spinner"></span>Загрузка данных...</div>');

    $.ajax({
      url: './events.json',
      method: 'GET',
      dataType: 'json',
      cache: false,
      success: function(data) {
        console.log('✅ Данные загружены');
        renderTimeline(data);
      },
      error: function() {
        $container.html('<div class="error-msg">❌ Ошибка загрузки events.json</div>');
      }
    });
  }

  loadData();

});
</script>

</body>
