<!doctype html>
<html lang="ru">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
 <meta http-equiv="X-UA-Compatible" content="IE=edge">
 <title>Календарь</title>
 <link rel="stylesheet" href="./js/jquery.timeline.min.css">
 <link rel="shortcut icon" href="./img/favicon.ico" type="image/x-icon">
 <style>
  .timeline-container {
    margin-bottom: 1px;
    border: 1px solid #000000;
    border-radius: 0.1px;
    padding: 0.1px;
  }
  .timeline-container .month-title {
    font-size: 10px;
    font-weight: bold;
    text-align: left;
    background: #410303;
    color: black;
  }
  .loading {
    text-align: center;
    padding: 1px;
    font-size: 10px;
    color: #666;
  }
  .loading .spinner {
    display: inline-block;
    width: 1px;
    height: 1px;
    border: 1px solid #f3f3f3;
    border-top: 1px solid #007bff;
    border-radius: 1%;
    animation: spin 1s linear infinite;
    margin-right: 1px;
    vertical-align: middle;
  }
  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  .error-msg {
    text-align: left;
    padding: 1px;
    color: red;
    font-size: 10px;
    background: #fff0f0;
    border-radius: 1px;
    border: 2px solid red;
  }
 </style>
</head>
<body>

<div class="container-fluid">
 <section class="row">
  <div class="col-12" id="timelineContainer">
    Загрузка данных...
   </div>
  </div>
 </section>
</div>

<script src="./js/jquery-3.3.1.min.js"></script>
<script src="./js/jquery.timeline.min.js"></script>

<script>
$(function() {

  // ===== БАЗОВЫЕ НАСТРОЙКИ TIMELINE =====
  const baseOptions = {
    type: 'bar',
    scale: 'day',
    range: 6,
    shift: true,
    rows: 4,
    minGridSize: 90,
    headline: {
      display: true,
      range: true,
      locale: 'ru-RU',
      format: {
        timeZone: 'Asia/Omsk',
        hour12: false,
        year: 'numeric',
        month: 'long',
        day: 'numeric',
        weekday: 'short'
      }
    },
    sidebar: {
      sticky: true,
      list: [
        '<img src="./img/arena.png" alt="Мероприятие" class="sidebar-icon" />',
        '<img src="./img/khl.png" alt="КХЛ" class="sidebar-icon" />',
        '<img src="./img/mhl.png" alt="МХЛ" class="sidebar-icon" />',
        '<img src="./img/vhl.png" alt="ВХЛ" class="sidebar-icon" />'
      ]
    },
    ruler: {
      top: {
        lines: ['month', 'day', 'weekday'],
        height: 30,
        fontSize: 20,
        color: '#FFF',
        background: '#333',
        locale: 'ru-RU',
        format: {
          timeZone: 'Asia/Omsk',
          hour12: false,
          year: 'numeric',
          month: 'long',
          day: 'numeric',
          weekday: 'short'
        }
      }
    },
    rangeAlign: 'day',
    hideScrollbar: true,
    zoom: true
  };

  // ===== ФУНКЦИЯ ОТОБРАЖЕНИЯ TIMELINE =====
  function renderTimeline(data) {
    const $container = $('#timelineContainer');
    $container.empty();

    if (!data || !data.months || data.months.length === 0) {
      $container.html('<div class="error-msg">⚠️ Нет данных для отображения</div>');
      return;
    }

    console.log('✅ Данные загружены, месяцев:', data.months.length);

    // Генерируем HTML
    let html = '';
    data.months.forEach(function(monthData, index) {
      console.log(`  Месяц ${index + 1}: ${monthData.month}, событий: ${monthData.events ? monthData.events.length : 0}`);
      
      html += '<div class="timeline-container">';
      html += '<div id="' + monthData.id + '">';
      html += '<ul class="timeline-events">';

      if (monthData.events && monthData.events.length > 0) {
        monthData.events.forEach(function(event) {
          // ===== ВАЖНО: ПРАВИЛЬНО ФОРМИРУЕМ data-timeline-node =====
          const node = event.node;
          let nodeObj = {};
          for (let key in node) {
            nodeObj[key] = node[key];
          }
          
          // Преобразуем объект в JSON строку для data-атрибута
          const nodeJson = JSON.stringify(nodeObj);
          
          html += '<li data-timeline-node=\'' + nodeJson + '\'>';
          html += event.html;
          html += '</li>';
        });
      } else {
        html += '<li style="padding:20px;text-align:center;color:#999;">Нет событий</li>';
      }

      html += '</ul>';
      html += '</div>';
      html += '</div>';
    });

    $container.html(html);

    // Инициализация каждого timeline
    data.months.forEach(function(monthData, index) {
      setTimeout(function() {
        const options = $.extend({}, baseOptions, {
          startDatetime: monthData.start,
          endDatetime: monthData.end,
        });

        try {
          const $tl = $('#' + monthData.id);
          if ($tl.length > 0) {
            $tl.Timeline(options);
            console.log(`  ✅ Инициализирован: ${monthData.id}`);
          } else {
            console.warn(`  ⚠️ Элемент не найден: ${monthData.id}`);
          }
        } catch(e) {
          console.error(`  ❌ Ошибка инициализации ${monthData.id}:`, e);
        }
      }, index * 300);
    });

    const totalEvents = data.months.reduce((sum, m) => sum + (m.events ? m.events.length : 0), 0);
    console.log('📊 Всего событий: ' + totalEvents);
  }

  // ===== ЗАГРУЗКА ДАННЫХ ИЗ ВНЕШНЕГО JSON =====
  function loadData() {
    const $container = $('#timelineContainer');
    $container.html('<div class="loading"><span class="spinner"></span>Загрузка данных...</div>');

    $.ajax({
      url: './events.json',
      method: 'GET',
      dataType: 'json',
      cache: false,
      success: function(data) {
        console.log('✅ Успешно загружено');
        renderTimeline(data);
      },
      error: function(xhr, status, error) {
        console.error('❌ Ошибка загрузки:', error);
        $container.html(
          '<div class="error-msg">' +
          '❌ Ошибка загрузки данных<br><br>' +
          '<small>Файл events.json не найден.</small>' +
          '</div>'
        );
      }
    });
  }

  // Загружаем данные
  loadData();

});
</script>

</body>
</html>
