<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Экспорт KHL событий (row 2)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #1a1e2c;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            padding: 20px;
        }
        .card {
            background: #262d3d;
            border-radius: 2rem;
            padding: 2.5rem 3rem;
            box-shadow: 0 25px 40px rgba(0,0,0,0.6);
            max-width: 600px;
            width: 100%;
            transition: 0.25s ease;
            border: 1px solid #3d465a;
        }
        h1 {
            font-size: 2rem;
            font-weight: 600;
            letter-spacing: -0.3px;
            color: #edf2fb;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        h1 small {
            font-size: 0.9rem;
            font-weight: 400;
            color: #8e9bb8;
            margin-left: auto;
        }
        .sub {
            color: #9aa8c9;
            border-left: 4px solid #f39c4b;
            padding-left: 14px;
            margin-bottom: 2rem;
            font-weight: 300;
            font-size: 0.95rem;
            background: rgba(243, 156, 75, 0.06);
            border-radius: 0 12px 12px 0;
            line-height: 1.5;
        }
        .preview-box {
            background: #10141f;
            border-radius: 1.2rem;
            padding: 1.2rem 1.6rem;
            margin-bottom: 2rem;
            max-height: 180px;
            overflow-y: auto;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 0.8rem;
            color: #b7c4e0;
            border: 1px solid #38405a;
            box-shadow: inset 0 4px 8px rgba(0,0,0,0.5);
        }
        .preview-box .label {
            color: #f1c40f;
            font-weight: 500;
            letter-spacing: 0.3px;
        }
        .preview-box .count {
            color: #7f8fa6;
        }
        .preview-box .event-item {
            border-bottom: 1px dashed #2c344b;
            padding: 6px 0;
        }
        .preview-box .event-item:last-child {
            border-bottom: none;
        }
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-top: 0.5rem;
        }
        .btn {
            background: #3d4a62;
            border: none;
            padding: 0.9rem 2rem;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1rem;
            color: #e9effa;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 6px 0 #1f2636;
            flex: 1 1 auto;
            justify-content: center;
            border: 1px solid #55607e;
        }
        .btn-primary {
            background: #f39c4b;
            color: #1a1e2c;
            border-color: #f7b06b;
            box-shadow: 0 6px 0 #b86d2a;
        }
        .btn-primary:hover {
            background: #f8b05c;
            transform: translateY(-2px);
            box-shadow: 0 8px 0 #b86d2a;
        }
        .btn-primary:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #b86d2a;
        }
        .btn-secondary {
            background: #2e374b;
            border-color: #4a5678;
        }
        .btn-secondary:hover {
            background: #3d4b66;
        }
        .badge {
            background: #1e2538;
            padding: 0.2rem 0.9rem;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 500;
            color: #bcc9e5;
            letter-spacing: 0.3px;
        }
        #statusMsg {
            margin-top: 1.2rem;
            padding: 0.8rem 1.2rem;
            border-radius: 40px;
            background: #1d253a;
            color: #cbd5ed;
            font-size: 0.9rem;
            border-left: 6px solid #f39c4b;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        #statusMsg.success {
            border-left-color: #4ecdc4;
            background: #1a2a2e;
            color: #b5f0ea;
        }
        #statusMsg.error {
            border-left-color: #e74c3c;
            background: #2e1e24;
            color: #f3b3ad;
        }
        .footer {
            margin-top: 1.8rem;
            font-size: 0.75rem;
            color: #5b688b;
            text-align: center;
            border-top: 1px solid #323d55;
            padding-top: 1.2rem;
        }
        .row2-highlight {
            background: #f39c4b15;
            border-radius: 20px;
            padding: 0.2rem 0.8rem;
            color: #f5b86b;
        }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #191f2e; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #f39c4b; border-radius: 10px; }
    </style>
</head>
<body>
<div class="card">
    <h1>
        🏒 KHL Exporter
        <small>row 2</small>
    </h1>
    <div class="sub">
        ⚡ Экспорт событий с <span class="row2-highlight">row = 2</span> из events.json в <strong>event_khl.ics</strong>
    </div>

    <div class="preview-box" id="previewBox">
        <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
            <span class="label">📋 события (row 2)</span>
            <span class="count" id="eventCount">0</span>
        </div>
        <div id="eventList">
            <div style="color: #657394; padding: 10px 0; text-align: center; font-style: italic;">Загрузка данных...</div>
        </div>
    </div>

    <div class="btn-group">
        <button class="btn btn-primary" id="exportBtn">📅 Скачать event_khl.ics</button>
        <button class="btn btn-secondary" id="previewBtn">🔄 Обновить</button>
    </div>

    <div id="statusMsg">
        <span>⏳</span> Нажмите «Скачать» для экспорта
    </div>
    <div class="footer">
        Источник: events.json · Фильтр: node.row === 2
    </div>
</div>

<script>
    (function() {
        // ----- helpers -----
        function pad(n) { return n.toString().padStart(2, '0'); }

        function toICalDate(dateStr) {
            // принимает "2026-08-02 00:30:00" или "2026-08-02"
            let dt = new Date(dateStr);
            if (isNaN(dt.getTime())) {
                // fallback: пробуем без времени
                dt = new Date(dateStr.replace(' ', 'T'));
            }
            if (isNaN(dt.getTime())) return '19700101T000000';
            const y = dt.getFullYear();
            const m = pad(dt.getMonth() + 1);
            const d = pad(dt.getDate());
            const h = pad(dt.getHours());
            const min = pad(dt.getMinutes());
            const s = pad(dt.getSeconds());
            return `${y}${m}${d}T${h}${min}${s}`;
        }

        function buildIcs(events) {
            if (!events || events.length === 0) {
                return null;
            }

            let ics = [
                'BEGIN:VCALENDAR',
                'VERSION:2.0',
                'PRODID:-//KHL Events//Row2//RU',
                'CALSCALE:GREGORIAN',
                'METHOD:PUBLISH'
            ];

            events.forEach(ev => {
                const node = ev.node || {};
                const startRaw = node.start || '';
                const endRaw = node.end || '';
                // если end отсутствует — используем start + 2 часа (или +1 день, но лучше взять start)
                let endDate = endRaw || startRaw;
                // если end === start, добавим 2 часа, чтобы событие не было нулевым
                if (endDate === startRaw && startRaw) {
                    try {
                        const d = new Date(startRaw);
                        d.setHours(d.getHours() + 2);
                        endDate = d.toISOString().replace('T', ' ').slice(0, 19);
                    } catch (_) { /* ignore */ }
                }

                const dtstart = toICalDate(startRaw);
                const dtend = toICalDate(endDate);

                // summary: берём из html, очищаем от тегов
                let summary = ev.html || 'KHL event';
                summary = summary.replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();
                // убираем лишние пробелы, обрезаем
                if (summary.length > 80) summary = summary.slice(0, 80) + '…';

                // description: копия summary + дата
                const desc = `Матч / событие KHL (row 2)\n${summary}\nДата: ${startRaw || ''}`;

                ics.push(
                    'BEGIN:VEVENT',
                    `UID:${Date.now()}-${Math.random().toString(36).slice(2, 6)}@khl-exporter`,
                    `DTSTAMP:${toICalDate(new Date().toISOString().slice(0,19).replace('T', ' '))}`,
                    `DTSTART:${dtstart}`,
                    `DTEND:${dtend}`,
                    `SUMMARY:${summary}`,
                    `DESCRIPTION:${desc}`,
                    'END:VEVENT'
                );
            });

            ics.push('END:VCALENDAR');
            return ics.join('\r\n');
        }

        // ----- загрузка и фильтрация -----
        async function fetchAndFilter() {
            try {
                const response = await fetch('./events.json');
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status} — не удалось загрузить events.json`);
                }
                const data = await response.json();
                if (!data || !data.months || !Array.isArray(data.months)) {
                    throw new Error('Неверная структура: отсутствует months[]');
                }

                const allEvents = [];
                data.months.forEach(month => {
                    if (month.events && Array.isArray(month.events)) {
                        month.events.forEach(ev => {
                            // проверяем row === 2 (строгое равенство, учитываем что может быть строка или число)
                            const row = ev.node?.row;
                            if (row !== undefined && Number(row) === 2) {
                                allEvents.push(ev);
                            }
                        });
                    }
                });
                return allEvents;
            } catch (err) {
                console.error('Ошибка загрузки:', err);
                throw err;
            }
        }

        // ----- отображение превью -----
        function renderPreview(events) {
            const listEl = document.getElementById('eventList');
            const countEl = document.getElementById('eventCount');
            if (!listEl) return;

            if (!events || events.length === 0) {
                listEl.innerHTML = `<div style="color: #7f8fa6; padding: 10px 0;">🔍 Нет событий с row = 2</div>`;
                countEl.textContent = '0';
                return;
            }

            countEl.textContent = events.length;
            let html = '';
            events.slice(0, 25).forEach((ev, idx) => {
                const node = ev.node || {};
                const start = node.start || '—';
                const end = node.end || '—';
                // извлечь текст из html
                let label = ev.html || '';
                label = label.replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();
                if (label.length > 55) label = label.slice(0, 52) + '…';
                html += `<div class="event-item">
                    <span style="color:#f1c40f;">#${idx+1}</span> 
                    <span style="color:#b7c4e0;">${label || 'Без названия'}</span>
                    <span style="color:#6f7ea0; font-size:0.7rem; float:right;">${start.slice(0,10)}</span>
                </div>`;
            });
            if (events.length > 25) {
                html += `<div style="color:#6a7b9c; padding:6px 0;">... и ещё ${events.length - 25} событий</div>`;
            }
            listEl.innerHTML = html;
        }

        // ----- основной экспорт -----
        async function exportIcs() {
            const statusEl = document.getElementById('statusMsg');
            try {
                statusEl.innerHTML = `<span>⏳</span> Загрузка и фильтрация...`;
                statusEl.className = '';

                const events = await fetchAndFilter();
                if (!events || events.length === 0) {
                    statusEl.innerHTML = `<span>⚠️</span> Нет событий с row = 2 для экспорта.`;
                    statusEl.className = 'error';
                    renderPreview([]);
                    return;
                }

                renderPreview(events);

                const icsContent = buildIcs(events);
                if (!icsContent) {
                    statusEl.innerHTML = `<span>❌</span> Не удалось сгенерировать ICS.`;
                    statusEl.className = 'error';
                    return;
                }

                // Скачиваем файл
                const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = 'event_khl.ics';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);

                statusEl.innerHTML = `<span>✅</span> Файл <strong>event_khl.ics</strong> скачан (${events.length} событий).`;
                statusEl.className = 'success';
            } catch (err) {
                console.error(err);
                statusEl.innerHTML = `<span>🚫</span> Ошибка: ${err.message || 'неизвестная'}`;
                statusEl.className = 'error';
                renderPreview([]);
            }
        }

        // ----- превью (обновить) -----
        async function refreshPreview() {
            const statusEl = document.getElementById('statusMsg');
            try {
                statusEl.innerHTML = `<span>🔄</span> Обновление...`;
                statusEl.className = '';
                const events = await fetchAndFilter();
                renderPreview(events);
                if (events.length === 0) {
                    statusEl.innerHTML = `<span>ℹ️</span> Событий с row = 2 не найдено.`;
                    statusEl.className = '';
                } else {
                    statusEl.innerHTML = `<span>✅</span> Найдено ${events.length} событий (row 2).`;
                    statusEl.className = 'success';
                }
            } catch (err) {
                statusEl.innerHTML = `<span>🚫</span> Ошибка: ${err.message}`;
                statusEl.className = 'error';
                renderPreview([]);
            }
        }

        // ----- инициализация -----
        document.addEventListener('DOMContentLoaded', () => {
            const exportBtn = document.getElementById('exportBtn');
            const previewBtn = document.getElementById('previewBtn');

            exportBtn.addEventListener('click', exportIcs);
            previewBtn.addEventListener('click', refreshPreview);

            // первичная загрузка
            refreshPreview();
        });
    })();
</script>
</body>
</html>
