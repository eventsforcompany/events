<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Календарь Авангард</title>
    
    <!-- Стили -->
    <style>
        :root { --border-color: #000; }
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body { padding: 20px; background: #f9f9f9; }

        /* Навигация (вверх) */
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 1px;
        }
        .btn-nav {
            padding: 10px 10px;
            font-size: 16px;
            background: #fff;
            border: 2px solid var(--border-color);
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.2s;
        }
        .btn-nav:hover { background: #000; color: #fff; }
        .btn-nav:disabled { opacity: 0.3; cursor: not-allowed; background: #eee; color: #000;}

        /* 📌 Легенда + Кнопки в одну строку */
        .top-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 15px 20px; /* Отступы между элементами */
            margin-bottom: 30px;
        }

        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        .legend-item { display: flex; align-items: center; gap: 5px; font-size: 14px; border: 1px solid var(--border-color); padding: 5px 10px; background: #fff; }
        .color-box { width: 20px; height: 20px; border: 1px solid #000; }

        /* Кнопки выбора вида и Сохранения (внутри top-bar) */
        .view-controls {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .btn-view, .btn-save {
            width: 40px;
            height: 40px;
            border: 2px solid var(--border-color);
            background: #fff;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            border-radius: 5px;
            transition: all 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .btn-view:hover, .btn-save:hover { background: #eee; }
        .btn-view.active {
            background: #000;
            color: #fff;
            border-color: #000;
        }
        .btn-save {
            width: auto;
            padding: 0 15px;
            font-weight: normal;
            font-size: 14px;
            background: #e6f2ff;
            border-color: #007bff;
            color: #0056b3;
        }
        .btn-save:hover {
            background: #007bff;
            color: #fff;
            border-color: #007bff;
        }

        /* 📌 Сетка: 3 колонки по 2 месяца (дефолт) */
        .calendar-grid {
            display: grid;
            gap: 40px 20px;
        }
        .grid-6 { grid-template-columns: repeat(3, 1fr); max-width: 1920px; margin: 0 auto; }
        .grid-4 { grid-template-columns: repeat(2, 2fr); max-width: 1920px; margin: 0 auto; }
        .grid-2 { grid-template-columns: repeat(2, 1fr); max-width: 1920px; margin: 0 auto; }
        .grid-1 { grid-template-columns: repeat(1, 1fr); max-width: 1600px; margin: 0 auto; }

        @media (max-width: 1400px) { .grid-6 { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 900px) { 
            .grid-6 { grid-template-columns: 1fr; } 
            .grid-2, .grid-1 { max-width: 100%; }
        }

        /* Месяц */
        .month-container {
            background: #fff;
            display: none;
        }
        .month-header {
            text-align: center;
            font-weight: bold;
            font-size: 18px;
            padding: 8px 0;
            margin-bottom: 0;
            background: #f5f5f5;
            border-bottom: 2px solid var(--border-color); 
            border-top: 2px solid var(--border-color);
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
        }
        .day-header {
            border-right: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            padding: 6px 0;
            text-align: center;
            font-size: 12px;
            background: #fff;
            height: 35px;
        }
        .day-header:last-child { border-right: none; }
        .day-header:nth-child(-n+7) { border-top: 1px solid var(--border-color); }
        .weekend-header { color: #d32f2f; }

        .day-cell {
            border: 1px solid var(--border-color);
            height: 85px;
            width: 100%;
            position: relative;
            padding: 0;
            background: #fff;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .day-number {
            position: absolute;
            top: 1px;
            right: 2px;
            font-size: 11px;
            font-weight: bold;
            z-index: 10;
            background: transparent;
            padding: 0 2px;
            pointer-events: none;
        }

        .event {
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
            border: 0;
            border-radius: 0;
            box-shadow: none;
            font-size: 11px;
            line-height: 1.1;
            word-break: break-word;
            white-space: normal;
        }
        .event b { font-weight: 900; }
        
        .empty-cell { 
            background: transparent; 
            height: 85px;
            width: 100%;
            border: none !important; 
        }

        .bg-FACDE5 { background-color: #FACDE5; }
        .bg-92D050 { background-color: #92D050; }
        .bg-F39C4b { background-color: #F39C4b; }
        .bg-891115 { background-color: #891115; color: #fff; }
    </style>
</head>
<body>


    <!-- 📌 ОДНА СТРОКА: Легенда + Кнопки 1,2,6 + Сохранить -->
    <div class="top-bar">
        <div class="legend">
            <div class="legend-item"><div class="color-box bg-FACDE5"></div> Мероприятия</div>
            <div class="legend-item"><div class="color-box bg-92D050"></div> Домашний матч</div>
            <div class="legend-item"><div class="color-box bg-F39C4b"></div> Гостевой матч</div>
        </div>
        <div class="controls">
            <button class="btn-nav" id="prevBtn">◀</button>
            <button class="btn-nav" id="nextBtn">▶</button>
        </div>
        <div class="view-controls">
            <button class="btn-view" data-view="1">1</button>
            <button class="btn-view" data-view="2">2</button>
            <button class="btn-view" data-view="4">4</button>
            <button class="btn-view active" data-view="6">6</button>
            <a href="./index.html" class="btn-link">📌Timline</a>
            <a href="./skk.html" class="btn-link">📌Арена</a>
            <button class="btn-save" id="saveBtn">💾 🏟️ СКК 🖨️</button>
        </div>
    </div>

    <div id="app" class="calendar-grid grid-2"></div>


    <script src="./js/ics.js"></script>
    <!-- Подключаем JQuery -->
    <script src="./js/jquery-3.3.1.min.js"></script>
    <!-- Подключаем html2canvas -->
    <script src="./js/html2canvas.min.js"></script>

    <script>
        let fullData = [];
        let currentStartIndex = 0; 
        let viewMode = 2;

        const daysOfWeek = ['пн', 'вт', 'ср', 'чт', 'пт', 'сб', 'вс'];

        $(document).ready(function() {
            loadAndRender(0, 2);

            $('#prevBtn').on('click', function() {
                if (currentStartIndex >= viewMode) {
                    loadAndRender(currentStartIndex - viewMode, viewMode);
                }
            });
            
            $('#nextBtn').on('click', function() {
                if (currentStartIndex + viewMode < fullData.length) {
                    loadAndRender(currentStartIndex + viewMode, viewMode);
                }
            });

            $('.btn-view').on('click', function() {
                $('.btn-view').removeClass('active');
                $(this).addClass('active');
                viewMode = parseInt($(this).data('view'));
                const $grid = $('#app');
                $grid.removeClass('grid-1 grid-2 grid-6').addClass(`grid-${viewMode}`);
                currentStartIndex = 0;
                loadAndRender(0, viewMode);
            });

            // 🖼️ КНОПКА СОХРАНЕНИЯ
            $('#saveBtn').on('click', function() {
                // Получаем весь контент, который нужно сфотографировать (включая легенду и календарь)
                const $container = $('body');
                
                // Показываем лоадер (опционально)
                const originalText = $(this).text();
                $(this).text('⏳ Генерация...').prop('disabled', true);

                html2canvas($container[0], {
                    scale: 2, // Делает картинку в 2 раза четче (Retina)
                    useCORS: true,
                    backgroundColor: '#f9f9f9', // Цвет фона для картинки
                    logging: false
                }).then(canvas => {
                    // Восстанавливаем кнопку
                    $(this).text(originalText).prop('disabled', false);

                    // Создаем ссылку для скачивания
                    const link = document.createElement('a');
                    link.download = `календарь_авангард_${new Date().toISOString().slice(0,10)}.png`;
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                }).catch(err => {
                    console.error('Ошибка при создании скриншота:', err);
                    alert('Ошибка при сохранении картинки. Проверьте консоль.');
                    $(this).text(originalText).prop('disabled', false);
                });
            });
        });

        function loadAndRender(startIndex, count) {
            const app = $('#app');
            app.empty(); 

            if (fullData.length === 0) {
                $.ajax({
                    url: './events.json',
                    dataType: 'json',
                    success: function(data) {
                        fullData = data.months;
                        renderPage(startIndex, count);
                    },
                    error: function(xhr, status, error) {
                        app.html(`<div style="color: red; grid-column: 1/-1; text-align: center; padding: 50px;">
                            ❌ Ошибка загрузки JSON.
                        </div>`);
                        console.error(error);
                    }
                });
            } else {
                renderPage(startIndex, count);
            }
        }

        function renderPage(startIndex, count) {
            currentStartIndex = startIndex;
            const monthsToRender = fullData.slice(startIndex, startIndex + count);
            
            $('#prevBtn').prop('disabled', startIndex === 0);
            $('#nextBtn').prop('disabled', startIndex + count >= fullData.length);

            const app = $('#app');

            monthsToRender.forEach((monthObj, index) => {
                const monthHtml = buildMonthHTML(monthObj);
                const $month = $(monthHtml);
                app.append($month);
                $month.delay(index * 100).fadeIn(400);
            });
        }

        function buildMonthHTML(monthObj) {
            const allowedEvents = monthObj.events.filter(item => {
                const row = item.node.row;
                const bg = item.node.bgColor;
                if (row === 5) return true;
                if (row === 4 && bg === "#92D050") return true;
                return false;
            });

            const startParts = monthObj.start.split('-');
            const year = parseInt(startParts[0]);
            const monthIndex = parseInt(startParts[1]) - 1;
            
            const startDate = new Date(year, monthIndex, 1);
            const daysInMonth = new Date(year, monthIndex + 1, 0).getDate();

            let firstDayOffset = startDate.getDay();
            if (firstDayOffset === 0) firstDayOffset = 7; 
            firstDayOffset -= 1; 

            let totalSlots = firstDayOffset + daysInMonth;
            let rows = Math.ceil(totalSlots / 7);
            let totalCells = rows * 7;

            let html = `<div class="month-container" style="display: none;">
                <div class="month-header">${monthObj.month}</div>
                <div class="days-grid">`;

            for (let d = 0; d < 7; d++) {
                const weekendClass = d >= 5 ? 'weekend-header' : '';
                html += `<div class="day-header ${weekendClass}">${daysOfWeek[d]}</div>`;
            }

            const parsedEvents = allowedEvents.map(item => {
                const startPartsEv = item.node.start.split(/[\s-:]/);
                const endPartsEv = item.node.end.split(/[\s-:]/);
                const start = new Date(parseInt(startPartsEv[0]), parseInt(startPartsEv[1])-1, parseInt(startPartsEv[2]));
                const end = new Date(parseInt(endPartsEv[0]), parseInt(endPartsEv[1])-1, parseInt(endPartsEv[2]));
                return { ...item, startDate: start, endDate: end };
            });

            for (let i = 0; i < totalCells; i++) {
                const dayNum = i - firstDayOffset + 1;

                if (dayNum >= 1 && dayNum <= daysInMonth) {
                    html += `<div class="day-cell" data-day="${dayNum}">
                        <div class="day-number">${dayNum}</div>`;

                    const checkDate = new Date(year, monthIndex, dayNum);
                    const eventsForDay = parsedEvents.filter(ev => checkDate >= ev.startDate && checkDate <= ev.endDate);

                    eventsForDay.forEach(ev => {
                        const colorClass = `bg-${ev.node.bgColor.replace('#', '')}`;
                        html += `<div class="event ${colorClass}">${ev.html}</div>`;
                    });

                    html += `</div>`;
                } else {
                    html += `<div class="empty-cell"></div>`;
                }
            }

            html += `</div></div>`;
            return html;
        }
    </script>
</body>
</html>
