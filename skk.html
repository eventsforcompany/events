<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Календарь CKK</title>

    <style>
        :root { --border-color: #000; }
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body { 
            padding: 10px; 
            background: #3e4c60; 
            margin: 0;
            min-width: 320px;
        }

        .main-wrapper {
            width: 100%;
            max-width: 100%;
            margin: 0 auto;
            padding: 0;
        }

        /* ВЕРХНЯЯ ПАНЕЛЬ */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            padding: 10px 15px;
            background: #3e4c60;
            border-radius: 8px;
            margin-bottom: 20px;
            width: 100%;
            flex-wrap: wrap;
        }

        .top-bar-left {
            display: flex;
            align-items: center;
            gap: 15px;
            flex: 0 1 auto;
        }

        .top-bar-left img {
            width: 120px;
            height: 60px;
            border: none;
            flex-shrink: 0;
        }

        .legend {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 14px;
            border: 1px solid var(--border-color);
            padding: 4px 12px;
            background: transparent;
            white-space: nowrap;
            flex-shrink: 0;
            border-radius: 4px;
        }
        .legend-item:first-child {
            border: none;
            font-weight: bold;
            font-size: 20px;
            padding-left: 0;
        }
        .legend-item:last-child {
            border: none;
            font-weight: bold;
            color: #000000;
            font-size: 13px;
            padding: 0;
        }
        .color-box {
            width: 18px;
            height: 18px;
            border: 1px solid #000;
            flex-shrink: 0;
            border-radius: 3px;
        }

        .top-bar-right {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 0 1 auto;
        }

        .controls {
            display: flex;
            gap: 5px;
            align-items: center;
        }
        .btn-nav {
            padding: 6px 14px;
            font-size: 16px;
            background: transparent;
            border: 2px solid var(--border-color);
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s;
            min-width: 38px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        .btn-nav:hover { background: #000; color: #fff; }
        .btn-nav:disabled { opacity: 0.3; cursor: not-allowed; background: #eee; color: #000;}

        .view-controls {
            display: flex;
            gap: 4px;
            align-items: center;
        }
        .btn-view {
            width: 34px;
            height: 34px;
            border: 2px solid var(--border-color);
            background: transparent;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            transition: all 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }
        .btn-view:hover { background: #eee; }
        .btn-view.active {
            background: #000;
            color: #fff;
            border-color: #000;
        }

        .btn-link {
            padding: 0 16px;
            height: 34px;
            background: #ff6017;
            color: #ffffff;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            font-size: 13px;
            box-shadow: 0 3px 0 #b84d12;
            transition: 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            text-decoration: none;
            flex-shrink: 0;
            white-space: nowrap;
        }
        .btn-link:hover {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #b84d12;
        }

        .save-wrapper {
            display: flex;
            justify-content: flex-end;
            margin-top: 15px;
            padding: 0 15px;
        }

        .btn-save {
            padding: 0 24px;
            height: 40px;
            border: 2px solid #007bff;
            background: #e6f2ff;
            cursor: pointer;
            font-size: 14px;
            border-radius: 6px;
            color: #0056b3;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
            white-space: nowrap;
            font-weight: 600;
        }
        .btn-save:hover {
            background: #007bff;
            color: #fff;
            border-color: #007bff;
        }

        /* 📌 CANVAS КОНТЕЙНЕР */
        .canvas-container {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            width: 100%;
            padding: 0 15px;
        }
        #calendarCanvas {
            display: block;
            max-width: 100%;
            height: auto;
        }

        /* 🔥 СКРЫТЫЙ КОНТЕЙНЕР ДЛЯ ЭКСПОРТА */
        #screenshot-container {
            position: fixed;
            top: -99999px;
            left: -99999px;
            background: #f9f9f9;
            padding: 30px;
            z-index: -1;
            width: 1600px;
            --screenshot-month-font: 22px;
            --screenshot-day-header-font: 16px;
            --screenshot-day-number-font: 13px;
            --screenshot-event-font: 14px;
        }
        #screenshot-container .top-bar {
            background: #f9f9f9;
            margin-bottom: 25px;
            padding: 0;
        }
        #screenshot-container .top-bar-right,
        #screenshot-container .save-wrapper {
            display: none !important;
        }
        #screenshot-grid {
            display: grid;
            gap: 20px;
            width: 100%;
        }
        #screenshot-grid.grid-mode-1 { grid-template-columns: 1fr; }
        #screenshot-grid.grid-mode-2 { grid-template-columns: repeat(2, 1fr); }
        #screenshot-grid.grid-mode-4 { grid-template-columns: repeat(2, 1fr); }
        #screenshot-grid.grid-mode-6 { grid-template-columns: repeat(3, 1fr); }

        .screenshot-month-box {
            background: #ffffff;
            border: 2px solid #ccc;
            border-radius: 8px;
            padding: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
            overflow: hidden;
        }

        /* DOM-шаблон для экспорта */
        #screenshot-container .month-container {
            background: #fff;
            display: block;
        }
        #screenshot-container .month-header {
            text-align: center;
            font-weight: bold;
            font-size: var(--screenshot-month-font);
            padding: 10px 0;
            background: #f5f5f5;
            border-top: 2px solid #000;
            border-bottom: 2px solid #000;
            color: #000;
        }
        #screenshot-container .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            width: 100%;
        }
        #screenshot-container .day-header {
            border-right: 1px solid #000;
            border-bottom: 1px solid #000;
            padding: 8px 0;
            text-align: center;
            font-size: var(--screenshot-day-header-font);
            font-weight: 600;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #screenshot-container .day-header:last-child { border-right: none; }
        #screenshot-container .day-header:nth-child(-n+7) { border-top: 1px solid #000; }
        #screenshot-container .weekend-header { color: #ee5a5a; }
        #screenshot-container .day-cell {
            border: 1px solid #000;
            position: relative;
            padding: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            aspect-ratio: 1 / 0.77;
            min-height: 70px;
        }
        #screenshot-container .day-cell.today {
            border: 3px solid #1100ff !important;
        }
        #screenshot-container .day-number {
            position: absolute;
            top: 2px;
            right: 4px;
            font-size: var(--screenshot-day-number-font);
            font-weight: bold;
            color: #333;
            z-index: 5;
        }
        /* 🔥 Каждое событие в своей полосе (для экспорта) */
        #screenshot-container .event {
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            width: 100%;
            flex: 1;
            padding: 2px 3px;
            font-size: var(--screenshot-event-font);
            line-height: 1.2;
            word-break: break-word;
            font-weight: 500;
            min-height: 0;
        }
        #screenshot-container .empty-cell {
            aspect-ratio: 1 / 0.77;
            min-height: 70px;
            border: none;
        }

        .bg-FACDE5 { background-color: #FACDE5; color: #000; }
        .bg-92D050 { background-color: #92D050; color: #000; }
        .bg-F39C4b { background-color: #F39C4b; color: #fff; }
        .bg-fffff1 { background-color: #fffff1; color: #000; }
        .bg-999999 { background-color: #999999; color: #fa1313; border: 3px solid #e94343; }

        /* 📱 АДАПТИВ */
        @media (max-width: 900px) {
            .top-bar {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
            }
            .top-bar-left, .top-bar-right {
                justify-content: center;
                flex-wrap: wrap;
            }
        }
    </style>
</head>

<body>

<div class="main-wrapper">
    <!-- ВЕРХНЯЯ ПАНЕЛЬ -->
    <div class="top-bar">
        <div class="top-bar-left">
            <img src="./img/avangard.png" alt="Мероприятие"/>
            <div class="legend">
                <div class="legend-item">CKK им.Блинова</div>

<!-- 🔥 СКРЫТЫЙ КОНТЕЙНЕР ДЛЯ ЭКСПОРТА -->
<div id="screenshot-container">
    <div class="top-bar">
        <div class="top-bar-left">
            <img src="./img/avangard.png" alt="Мероприятие"/>
            <div class="legend">
                <div class="legend-item">CKK им.Блинова</div>
                <div class="legend-item"><div class="color-box bg-FACDE5"></div> Мероприятия</div>
                <div class="legend-item"><div class="color-box bg-92D050"></div> Домашний матч</div>
                <div class="legend-item"><div class="color-box bg-999999"></div> не согласовано</div>
                <div class="legend-item">обновлен<span class="date-display-screenshot"></span></div>
            </div>
        </div>
    </div>
    <div id="screenshot-grid" class="grid-mode-2"></div>
</div>

<script src="./js/jquery-3.3.1.min.js"></script>
<script src="./js/html2canvas.min.js"></script>

<script>
    let fullData = [];
    let currentStartIndex = 0; 
    let viewMode = 2;

    const daysOfWeek = ['пн', 'вт', 'ср', 'чт', 'пт', 'сб', 'вс'];

    // 📐 Размеры canvas в зависимости от режима (в 2× для Retina)
    const CANVAS_SIZES = {
        1: { w: 1400, h: 1000 },
        2: { w: 2400, h: 1000 },
        4: { w: 2400, h: 1400 },
        6: { w: 3200, h: 1400 }
    };

    // 📐 Параметры экспорта
    const SCREENSHOT_SETTINGS = {
        1: { width: 1400, monthFont: 28, dayHeaderFont: 20, dayNumberFont: 16, eventFont: 28 },
        2: { width: 2000, monthFont: 22, dayHeaderFont: 16, dayNumberFont: 13, eventFont: 16 },
        4: { width: 2000, monthFont: 22, dayHeaderFont: 16, dayNumberFont: 13, eventFont: 16 },
        6: { width: 2400, monthFont: 20, dayHeaderFont: 14, dayNumberFont: 12, eventFont: 12 }
    };

    // 🎨 Карта цветов
    const COLOR_MAP = {
        'FACDE5': '#FACDE5',
        '92D050': '#92D050',
        'F39C4b': '#F39C4b',
        'fffff1': '#fffff1',
        '999999': '#999999',
        '891115': '#891115'
    };

    // 📌 Получение даты изменения events.json
    function getFileModifiedDate(callback) {
        $.ajax({
            url: './events.json',
            type: 'HEAD',
            success: function(data, textStatus, xhr) {
                const lastModified = xhr.getResponseHeader('Last-Modified');
                if (lastModified) callback(new Date(lastModified));
                else callback(null);
            },
            error: function() { callback(null); }
        });
    }

    function formatDateTime(date) {
        if (!date || isNaN(date.getTime())) return null;
        const day = String(date.getDate()).padStart(2, '0');
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const year = date.getFullYear();
        const hours = String(date.getHours()).padStart(2, '0');
        const minutes = String(date.getMinutes()).padStart(2, '0');
        return `${day}.${month}.${year} ${hours}:${minutes}`;
    }

    // 📌 Поиск текущего месяца
    function findCurrentMonthIndex() {
        const now = new Date();
        const currentMonthNum = now.getMonth();
        const currentYear = now.getFullYear();
        const monthNames = ["январь", "февраль", "март", "апрель", "май", "июнь", 
                            "июль", "август", "сентябрь", "октябрь", "ноябрь", "декабрь"];
        const currentMonthName = monthNames[currentMonthNum];
        
        let foundIndex = -1;
        fullData.forEach((month, index) => {
            const monthStr = (month.month || '').toLowerCase().replace(/\s+/g, ' ').trim();
            if (monthStr.includes(currentMonthName) && monthStr.includes(String(currentYear))) {
                foundIndex = index;
            }
        });
        return foundIndex !== -1 ? foundIndex : 0;
    }

    // 📌 Применение настроек экспорта
    function applyScreenshotSettings(mode) {
        const settings = SCREENSHOT_SETTINGS[mode] || SCREENSHOT_SETTINGS[2];
        const $container = $('#screenshot-container');

        $container.css('width', settings.width + 'px');
        $container[0].style.setProperty('--screenshot-month-font', settings.monthFont + 'px');
        $container[0].style.setProperty('--screenshot-day-header-font', settings.dayHeaderFont + 'px');
        $container[0].style.setProperty('--screenshot-day-number-font', settings.dayNumberFont + 'px');
        $container[0].style.setProperty('--screenshot-event-font', settings.eventFont + 'px');
    }

    $(document).ready(function() {
        getFileModifiedDate(function(modifiedDate) {
            const dateStr = formatDateTime(modifiedDate) || new Date().toLocaleDateString('ru-RU', {
                day: '2-digit', month: '2-digit', year: 'numeric'
            });
            $('#date-display').text(dateStr);
            $('.date-display-screenshot').text(dateStr);
        });

        loadAndRender(0, 2);
    });

    // 
    // ЗАГРУЗКА
    // 
    function loadAndRender(startIndex, count) {
        if (fullData.length === 0) {
            $.ajax({
                url: './events.json',
                dataType: 'json',
                success: function(data) {
                    fullData = data.months;
                    let initialIndex = findCurrentMonthIndex();
                    
                    currentStartIndex = initialIndex;
                    renderCalendar(initialIndex, count);
                    renderScreenshotContainer(initialIndex, count);
                    applyScreenshotSettings(viewMode);
                },
                error: function(xhr, status, error) {
                    console.error("Ошибка загрузки JSON:", error);
                    alert("Не удалось загрузить events.json");
                }
            });
        } else {
            renderCalendar(startIndex, count);
            renderScreenshotContainer(startIndex, count);
            applyScreenshotSettings(viewMode);
        }
    }

    function renderCalendar(startIndex, count) {
        currentStartIndex = startIndex;
        const monthsToRender = fullData.slice(startIndex, startIndex + count);
        
        $('#prevBtn').prop('disabled', startIndex === 0);
        $('#nextBtn').prop('disabled', startIndex + count >= fullData.length);

        drawCalendarToCanvas(monthsToRender, count);
    }

    // 
    // РИСОВАНИЕ КАЛЕНДАРЯ НА CANVAS
    // 
    function drawCalendarToCanvas(months, count) {
        const canvas = document.getElementById('calendarCanvas');
        const ctx = canvas.getContext('2d');
        
        const size = CANVAS_SIZES[count] || CANVAS_SIZES[2];
        const W = size.w;
        const H = size.h;
        
        canvas.width = W;
        canvas.height = H;
        
        canvas.style.width = (W / 2) + 'px';
        canvas.style.height = (H / 2) + 'px';

        ctx.fillStyle = '#3e4c60';
        ctx.fillRect(0, 0, W, H);

        let cols, rows;
        if (count === 1) { cols = 1; rows = 1; }
        else if (count === 2) { cols = 2; rows = 1; }
        else if (count === 4) { cols = 2; rows = 2; }
        else { cols = 3; rows = 2; }

        const margin = 20;
        const gapX = 20;
        const gapY = 20;
        
        const availableW = W - 2 * margin;
        const availableH = H - 2 * margin;
        const monthW = (availableW - gapX * (cols - 1)) / cols;
        const monthH = (availableH - gapY * (rows - 1)) / rows;

        months.forEach((monthObj, idx) => {
            const col = idx % cols;
            const row = Math.floor(idx / cols);
            const x = margin + col * (monthW + gapX);
            const y = margin + row * (monthH + gapY);
            
            drawMonth(ctx, monthObj, x, y, monthW, monthH);
        });
    }

    // 
    // 🔥 РИСОВАНИЕ МЕСЯЦА (с поддержкой нескольких событий в дне)
    // 
    function drawMonth(ctx, monthObj, x, y, w, h) {
        const headerH = 40;
        const dayHeaderH = 30;
        const dayW = w / 7;
        const dayH = (h - headerH - dayHeaderH) / 6;

        // ---- Заголовок месяца ----
        ctx.fillStyle = '#000';
        ctx.font = 'bold 24px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(monthObj.month, x + w / 2, y + headerH / 2);

        ctx.strokeStyle = '#000';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(x, y + headerH);
        ctx.lineTo(x + w, y + headerH);
        ctx.stroke();

        // ---- Дни недели ----
        const dayNames = ['пн', 'вт', 'ср', 'чт', 'пт', 'сб', 'вс'];
        for (let d = 0; d < 7; d++) {
            const dx = x + d * dayW;
            const dy = y + headerH;

            ctx.strokeStyle = '#000';
            ctx.lineWidth = 1;
            ctx.strokeRect(dx, dy, dayW, dayHeaderH);

            ctx.fillStyle = d >= 5 ? '#ee5a5a' : '#000';
            ctx.font = 'bold 16px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(dayNames[d], dx + dayW / 2, dy + dayHeaderH / 2);
        }

        // ---- Парсинг ----
        const startParts = monthObj.start.split('-');
        const year = parseInt(startParts[0]);
        const monthIndex = parseInt(startParts[1]) - 1;

        const startDate = new Date(year, monthIndex, 1);
        const daysInMonth = new Date(year, monthIndex + 1, 0).getDate();

        let firstDayOffset = startDate.getDay();
        if (firstDayOffset === 0) firstDayOffset = 7;
        firstDayOffset -= 1;

        const allowedEvents = monthObj.events.filter(item => {
            const row = item.node.row;
            const bg = item.node.bgColor;
            if (row === 5) return true;
            if (row === 4 && bg === "#92D050") return true;
            return false;
        });

        const parsedEvents = allowedEvents.map(item => {
            const s = item.node.start.split(/[\s-:]/);
            const e = item.node.end.split(/[\s-:]/);
            const start = new Date(parseInt(s[0]), parseInt(s[1])-1, parseInt(s[2]));
            const end = new Date(parseInt(e[0]), parseInt(e[1])-1, parseInt(e[2]));
            return { ...item, startDate: start, endDate: end };
        });

        // ---- Сетка ----
        const totalCells = Math.ceil((firstDayOffset + daysInMonth) / 7) * 7;
        const today = new Date();
        const gridStartY = y + headerH + dayHeaderH;

        for (let i = 0; i < totalCells; i++) {
            const dayNum = i - firstDayOffset + 1;
            const col = i % 7;
            const row = Math.floor(i / 7);

            const dx = x + col * dayW;
            const dy = gridStartY + row * dayH;

            if (dayNum >= 1 && dayNum <= daysInMonth) {
                const checkDate = new Date(year, monthIndex, dayNum);
                const isToday = (dayNum === today.getDate() && 
                                 monthIndex === today.getMonth() && 
                                 year === today.getFullYear());

                // 🔥 Все события дня
                const eventsForDay = parsedEvents.filter(ev => 
                    checkDate >= ev.startDate && checkDate <= ev.endDate
                );

                // 🔥 Рисуем каждое событие отдельной полосой
                if (eventsForDay.length > 0) {
                    const eventH = dayH / eventsForDay.length;

                    eventsForDay.forEach((ev, evIdx) => {
                        const evY = dy + evIdx * eventH;

                        // Фон полосы
                        const bgKey = ev.node.bgColor.replace('#', '');
                        ctx.fillStyle = COLOR_MAP[bgKey] || '#ffffff';
                        ctx.fillRect(dx, evY, dayW, eventH);

                        // Текст
                        const textColor = (bgKey === 'F39C4b' || bgKey === '891115') ? '#fff' : '#000';
                        const cleanText = cleanHtmlText(ev.html);

                        ctx.fillStyle = textColor;
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';

                        drawFittedText(ctx, cleanText,
                            dx + dayW / 2,
                            evY + eventH / 2,
                            dayW - 8,
                            eventH - 4);
                    });
                }

                // Рамка ячейки
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 1;
                ctx.strokeRect(dx, dy, dayW, dayH);

                // Синяя рамка "сегодня"
                if (isToday) {
                    ctx.strokeStyle = '#1100ff';
                    ctx.lineWidth = 4;
                    ctx.strokeRect(dx + 2, dy + 2, dayW - 4, dayH - 4);
                }

                // Номер дня
                ctx.fillStyle = '#333';
                ctx.font = 'bold 12px Arial';
                ctx.textAlign = 'right';
                ctx.textBaseline = 'top';
                ctx.fillText(dayNum, dx + dayW - 5, dy + 4);
            }
        }
    }

    // 📌 Очистка HTML → текст
    function cleanHtmlText(html) {
        return html
            .replace(/<br\s*\/?>/gi, '\n')
            .replace(/<\/p>/gi, '\n')
            .replace(/<[^>]+>/g, '')
            .replace(/&nbsp;/g, ' ')
            .replace(/\n{2,}/g, '\n')
            .trim();
    }

    // 📌 Авто-подгонка шрифта
    function drawFittedText(ctx, text, centerX, centerY, maxW, maxH) {
        const lines = text.split('\n').filter(l => l.trim() !== '');
        if (lines.length === 0) return;

        let fontSize = 14;
        const minFontSize = 6;

        while (fontSize > minFontSize) {
            ctx.font = `bold ${fontSize}px Arial`;
            const maxLineW = Math.max(...lines.map(l => ctx.measureText(l).width));
            const lineH = fontSize * 1.15;
            const totalH = lineH * lines.length;

            if (maxLineW <= maxW && totalH <= maxH) break;
            fontSize--;
        }

        ctx.font = `bold ${fontSize}px Arial`;
        const lineH = fontSize * 1.15;
        const totalH = lineH * lines.length;
        const startY = centerY - totalH / 2 + lineH / 2;

        lines.forEach((line, i) => {
            let displayLine = line;
            if (ctx.measureText(displayLine).width > maxW) {
                while (displayLine.length > 3 && ctx.measureText(displayLine + '…').width > maxW) {
                    displayLine = displayLine.slice(0, -1);
                }
                displayLine += '…';
            }
            ctx.fillText(displayLine, centerX, startY + i * lineH);
        });
    }

    // 
    // ЭКСПОРТ
    // 
    function renderScreenshotContainer(startIndex, count) {
        const $screenshotGrid = $('#screenshot-grid');
        $screenshotGrid.empty();

        const monthsToRender = fullData.slice(startIndex, startIndex + count);
        monthsToRender.forEach((monthObj) => {
            const monthHtml = `<div class="screenshot-month-box">${buildMonthHTML(monthObj)}</div>`;
            $screenshotGrid.append(monthHtml);
        });
    }

    $('#saveBtn').on('click', function() {
        renderScreenshotContainer(currentStartIndex, viewMode);
        applyScreenshotSettings(viewMode);

        const $container = $('#screenshot-container');
        const originalText = $(this).text();
        $(this).text('⏳ Генерация...').prop('disabled', true);

        setTimeout(() => {
            html2canvas($container[0], {
                scale: 3,
                useCORS: true,
                backgroundColor: '#f9f9f9',
                logging: false,
                windowWidth: $container.width(),
                windowHeight: $container.height()
            }).then(canvas => {
                $(this).text(originalText).prop('disabled', false);
                const link = document.createElement('a');
                link.download = `календарь_авангард_${new Date().toISOString().slice(0,10)}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            }).catch(err => {
                console.error("Ошибка скриншота:", err);
                $(this).text(originalText).prop('disabled', false);
                alert("Ошибка при создании скриншота!");
            });
        }, 100);
    });

    // 
    // DOM-ШАБЛОН для экспорта
    // 
    function buildMonthHTML(monthObj) {
        const allowedEvents = monthObj.events.filter(item => {
            const row = item.node.row;
            const bg = item.node.bgColor;
            if (row === 5) return true;
            if (row === 4 && bg === "#92D050") return true;
            return false;
        });

        const startParts = monthObj.start.split('-');
        const year = parseInt(startParts[0]);
        const monthIndex = parseInt(startParts[1]) - 1;
        
        const startDate = new Date(year, monthIndex, 1);
        const daysInMonth = new Date(year, monthIndex + 1, 0).getDate();

        let firstDayOffset = startDate.getDay();
        if (firstDayOffset === 0) firstDayOffset = 7; 
        firstDayOffset -= 1; 

        let totalSlots = firstDayOffset + daysInMonth;
        let rows = Math.ceil(totalSlots / 7);
        let totalCells = rows * 7;

        let html = `<div class="month-container" style="display: block;">
            <div class="month-header">${monthObj.month}</div>
            <div class="days-grid">`;

        for (let d = 0; d < 7; d++) {
            const weekendClass = d >= 5 ? 'weekend-header' : '';
            html += `<div class="day-header ${weekendClass}">${daysOfWeek[d]}</div>`;
        }

        const parsedEvents = allowedEvents.map(item => {
            const startPartsEv = item.node.start.split(/[\s-:]/);
            const endPartsEv = item.node.end.split(/[\s-:]/);
            const start = new Date(parseInt(startPartsEv[0]), parseInt(startPartsEv[1])-1, parseInt(startPartsEv[2]));
            const end = new Date(parseInt(endPartsEv[0]), parseInt(endPartsEv[1])-1, parseInt(endPartsEv[2]));
            return { ...item, startDate: start, endDate: end };
        });

        const today = new Date();
        const todayDay = today.getDate();
        const todayMonth = today.getMonth();
        const todayYear = today.getFullYear();

        for (let i = 0; i < totalCells; i++) {
            const dayNum = i - firstDayOffset + 1;

            if (dayNum >= 1 && dayNum <= daysInMonth) {
                const isToday = (dayNum === todayDay && monthIndex === todayMonth && year === todayYear);
                const todayClass = isToday ? ' today' : '';
                
                html += `<div class="day-cell${todayClass}" data-day="${dayNum}">
                    <div class="day-number">${dayNum}</div>`;

                const checkDate = new Date(year, monthIndex, dayNum);
                const eventsForDay = parsedEvents.filter(ev => checkDate >= ev.startDate && checkDate <= ev.endDate);

                eventsForDay.forEach(ev => {
                    const colorClass = `bg-${ev.node.bgColor.replace('#', '')}`;
                    
                    let eventText = ev.html;
                    if (viewMode === 6) {
                        eventText = eventText
                            .replace('Тренировка АКАДЕМИЯ', 'Академия')
                            .replace('Турнир им. В. Блинова', 'Турнир Блинова')
                            .replace('Динамо М', 'Динамо')
                            .replace('Локомотив', 'Локо')
                            .replace('Автомобилист', 'Авто')
                            .replace('Сибирь', 'Сиб');
                    }

                    html += `<div class="event ${colorClass}">${eventText}</div>`;
                });

                html += `</div>`;
            } else {
                html += `<div class="empty-cell"></div>`;
            }
        }

        html += `</div></div>`;
        return html;
    }

    // 
    // ОБРАБОТЧИКИ
    // 
    $('#prevBtn').on('click', function() {
        if (currentStartIndex >= viewMode) {
            loadAndRender(currentStartIndex - viewMode, viewMode);
        }
    });
    
    $('#nextBtn').on('click', function() {
        if (currentStartIndex + viewMode < fullData.length) {
            loadAndRender(currentStartIndex + viewMode, viewMode);
        }
    });

    $('.btn-view').on('click', function() {
        $('.btn-view').removeClass('active');
        $(this).addClass('active');
        viewMode = parseInt($(this).data('view'));

        const $screenshotGrid = $('#screenshot-grid');
        $screenshotGrid.removeClass('grid-mode-1 grid-mode-2 grid-mode-4 grid-mode-6').addClass(`grid-mode-${viewMode}`);

        const foundIndex = findCurrentMonthIndex();
        currentStartIndex = foundIndex;
        loadAndRender(foundIndex, viewMode);
    });
</script>
